# CI/CD for hanzoai/billing — billing.hanzo.ai.
#
# This file IS the opt-in. A push to git.hanzo.ai fires ONE forge-wide system
# webhook at platform.hanzo.ai, which reads this document at the pushed sha and
# schedules a BuildKit job per declared image. A repo WITHOUT a hanzo.yml is
# accepted and builds nothing — the delivery is green, the log says "202
# Accepted", and no image exists. That is the shape this repo was in: it shipped
# by hand, so a merged fix could sit indefinitely looking deployed.

images:
  - name: billing
    repo: ghcr.io/hanzoai/billing
    context: .
    dockerfile: ./Dockerfile

test:
  # `pnpm lint` is the PCI gate, not a style pass: scripts/pci-scope.mjs asserts
  # Square's hosted fields are the only path a card number can take, and it scans
  # the BUILT bundle as well as the source — so it must run after the build or it
  # examines nothing and passes for the wrong reason.
  #
  # `pnpm build` also runs gui-css-check, which fails on a class no delivered
  # sheet defines. That matters here more than usual: this app carries the whole
  # stylesheet itself, so an unmatched class is silently unstyled rather than a
  # build error.
  - pnpm install --frozen-lockfile
  - pnpm typecheck
  - pnpm build
  - pnpm lint
