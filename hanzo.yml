# CI/CD for hanzoai/billing — billing.hanzo.ai.
#
# This file IS the opt-in. A push to git.hanzo.ai fires ONE forge-wide system
# webhook at platform.hanzo.ai, which reads this document at the pushed sha and
# schedules a BuildKit job per declared image. A repo WITHOUT a hanzo.yml is
# accepted and builds nothing — the delivery is green, the log says "202
# Accepted", and no image exists. That is the shape this repo was in: it shipped
# by hand, so a merged fix could sit indefinitely looking deployed.

images:
  - name: billing
    repo: ghcr.io/hanzoai/billing
    context: .
    dockerfile: ./Dockerfile

test:
  - name: typecheck
    run: |
      pnpm install --frozen-lockfile
      pnpm typecheck
  - name: test
    run: pnpm test
  - name: build
    run: pnpm build
  - name: lint
    run: pnpm lint
