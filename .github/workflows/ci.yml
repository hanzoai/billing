# Build + deploy of the app image is now the native Hanzo pipeline:
# .hanzo/workflows/deploy.yml (Hanzo Git push → act_runner → BuildKit →
# ghcr.io/hanzoai/billing:<sha> → kubectl patch app billing → operator).
# GitHub is a mirror; this workflow keeps only test/lint/build validation.
# NO GitHub builders push images or deploy anymore.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
