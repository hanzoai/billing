name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: GITHUB_PAGES=true pnpm build

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy-pages:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-docker:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hanzoai/billing:latest
            ghcr.io/hanzoai/billing:${{ github.sha }}

  deploy-k8s:
    needs: deploy-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_K8S == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Hanzo KMS
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          # Authenticate with Hanzo KMS
          TOKEN=$(curl -s -X POST https://kms.hanzo.ai/api/v1/auth/universal-auth/login \
            -H "Content-Type: application/json" \
            -d "{\"clientId\": \"$KMS_CLIENT_ID\", \"clientSecret\": \"$KMS_CLIENT_SECRET\"}" \
            | jq -r '.accessToken')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to authenticate with Hanzo KMS"
            exit 1
          fi

          # Fetch deploy secrets from hanzo-iam project
          SECRETS=$(curl -s https://kms.hanzo.ai/api/v3/secrets/raw \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "workspaceSlug=hanzo-iam" \
            --data-urlencode "environment=prod" \
            --data-urlencode "secretPath=/github-actions/deploy" \
            -G)

          if ! echo "$SECRETS" | jq -e '.secrets' > /dev/null 2>&1; then
            echo "::error::Failed to fetch secrets from Hanzo KMS"
            echo "$SECRETS" | jq . 2>/dev/null || echo "$SECRETS"
            exit 1
          fi

          # Export each secret as env var (masked in logs)
          echo "$SECRETS" | jq -r '.secrets[] | "\(.secretKey)=\(.secretValue)"' | while IFS='=' read -r key value; do
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ env.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save do-sfo3-hanzo-k8s

      - name: Deploy to K8s
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/billing billing=ghcr.io/hanzoai/billing:${{ github.sha }} -n hanzo
          kubectl rollout status deployment/billing -n hanzo --timeout=120s

  deploy-cloudflare:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_CLOUDFLARE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=hanzo-billing
